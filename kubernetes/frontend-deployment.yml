apiVersion: apps/v1
kind: Deployment
metadata:
  name: chess-ecosystem-frontend
  labels:
    app: chess-ecosystem
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: chess-ecosystem
      component: frontend
  template:
    metadata:
      labels:
        app: chess-ecosystem
        component: frontend
    spec:
      containers:
      - name: frontend
        image: your-registry/chess-ecosystem-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: REACT_APP_API_BASE_URL
          value: "https://api.chess-ecosystem.com/api"
        - name: REACT_APP_RAZORPAY_KEY
          valueFrom:
            secretKeyRef:
              name: chess-ecosystem-secrets
              key: razorpay-public-key
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
