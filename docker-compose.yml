version: '3.8'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: chess-coaching

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-5005}:5005"
    environment:
      NODE_ENV: production
      PORT: 5005
      MONGODB_URI: mongodb://mongodb:27017/chess-coaching
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    depends_on:
      - mongodb

volumes:
  mongo_data:
